- aid: hexagon-ab:geocloud-graphql
  name: Hexagon GeoCloud GraphQL API
  description: The federated GraphQL API behind Hexagon GeoCloud (formerly HxDR / Reality Cloud Studio) for uploading, processing, organising, streaming and sharing reality-capture and geospatial data. 1,125 types, 93 Query fields, 168 Mutation fields and 3 Subscription fields. Covers projects and folders, assets, grouped assets and artifacts, processing pipelines (auto-registration, meshing, format conversion), scenes and annotations, streaming subscriptions and OGC endpoints, accounts, users and project membership, and a data-store shop with cart, quotation and order flows. Introspection is open to anonymous callers; every data-returning field requires an OIDC bearer token and answers UNAUTHENTICATED without one.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://geocloud.hexagon.com/documentation/
  baseURL: https://hxdr.app/graphql
  tags:
  - Geospatial
  - Reality Capture
  - GraphQL
  - Point Cloud
  - OGC
  properties:
  - type: GraphQL
    url: graphql/hexagon-hxdr.graphql
  - type: X-GraphQLIntrospection
    url: graphql/hexagon-hxdr-introspection.json
  - type: DataModel
    url: data-model/hexagon-data-model.yml
  - type: ErrorCatalog
    url: errors/hexagon-problem-types.yml
  - type: Conventions
    url: conventions/hexagon-conventions.yml
  - type: Documentation
    url: https://geocloud.hexagon.com/documentation/
- aid: hexagon-ab:geocloud-mcp
  name: Hexagon GeoCloud MCP Server
  description: A remote Model Context Protocol endpoint served from the Hexagon GeoCloud web property and discoverable through RFC 9728 protected-resource metadata and RFC 8414 authorization-server metadata on the same host. Two server routes are registered under the /wp-json/mcp namespace; both answer an anonymous tools/list with HTTP 401, so the tool set and its input schemas require authenticated introspection.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://geocloud.hexagon.com/
  baseURL: https://geocloud.hexagon.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Geospatial
  properties:
  - type: MCPServer
    url: mcp/hexagon-mcp.yml
