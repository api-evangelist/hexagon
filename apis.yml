- aid: hexagon:hxgn-eam-api
  name: HxGN EAM REST API
  description: Enterprise Asset Management REST API providing programmatic access to asset lifecycle data including equipment management, work orders, preventive maintenance, document attachments, and service requests. Defined in OpenAPI 3 and available through the Hexagon documentation portal.
