  name: Hexagon Nexus API
  description: REST APIs for the Nexus digital reality platform enabling manufacturers to build connected workflows integrating metrology, quality inspection, and production monitoring data. All endpoints are authenticated via OAuth 2.0 and route through an Application Gateway for rate limiting, quota management, logging, and analytics.
