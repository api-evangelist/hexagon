address_polymorphism:
  interface: AddressInterface
  note: 'The delivery address of any processed output is polymorphic. AddressInterface.endpoint is documented
    in the schema as "the path of the object, needs to be appended to the domain of the backend to form
    a complete URL", and concrete members select the delivery standard: AddressOgc3DOutput, AddressWmsOutput,
    AddressWmtsOutput, AddressWfsOutput, AddressHspcOutput, AddressLtsOutput, AddressCogOutput, AddressCubemapJsonOutput,
    AddressGeoJsonOutput, AddressPackOutput, AddressZipOutput, AddressDownloadableOutput. This is where
    the OGC standards recorded in conformance/hexagon-ab-conformance.yml actually surface at runtime.'
baselayers:
  note: A parallel polymorphic family for map backdrops - BaselayerOgc3DOutput, BaselayerWmsOutput,
    BaselayerWmtsOutput, BaselayerWfsOutput, BaselayerHspcOutput, BaselayerLtsOutput, BaselayerPanoramicOutput,
    BaselayerUrlOutput - created by the matching mutations createOgc3dBaselayer, createWmsBaselayer,
    createWmtsBaselayer and createWfsBaselayer, all gated on the CAN_EDIT_BASELAYER platform capability.
commerce_subgraph:
  note: A data-store shop is stitched into the same schema - CartOutput, CartItemOutput, quotation,
    getCart, viewCart, getAllOrders, getOrder, getLastOrder, getActivePaymentCard, getStripePublicKey,
    supportedCountries, validateAddressV2. Most of the subscription half is deprecated for 2026-09-30
    with the reason "Stripe subscriptions are no longer supported".
authorization_model:
  note: Capability-based, expressed in mutation descriptions rather than in scopes - named platform
    capabilities such as CAN_EDIT_BASELAYER and CAN_EDIT_STREAMING_SUBSCRIPTION gate individual mutations,
    and project membership roles gate the project spine. None of these capability names appear in the
    OAuth scope list at scopes/hexagon-ab-scopes.yml, so the token scope and the in-app permission are
    two different systems.
