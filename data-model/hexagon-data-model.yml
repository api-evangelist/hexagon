containment_spine: Account -> Project -> root Folder -> nested Folders -> GroupedAsset -> Asset -> Artifact. A GroupedAsset
  is the user-facing item in a folder; the Asset it wraps carries the geometry and the Artifacts are the processed
  derivatives (OGC 3D Tiles, HSPC point cloud, LTS, COG, WMS/WMTS/WFS service addresses, panoramic cubemaps, downloadable
  packages).
id_convention: Opaque UUID strings on the id field. There are no typed or prefixed identifiers, so an id carries
  no hint of what it points at - a client must track type alongside id.
