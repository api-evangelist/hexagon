        message: You can not access the requested resource.
        observed_on: 'POST https://hxdr.app/graphql {"query":"{getUser{id}}"} with no Authorization header'
        remediation: 'Obtain an OIDC bearer token from the hxauth.com geo-hxdr-prod realm and send it as Authorization: Bearer.'
      - code: GRAPHQL_VALIDATION_FAILED
