format: graphql-errors
format_note: >-
  Not RFC 9457. Failures arrive as GraphQL errors[] over HTTP 200, with a machine
  code in errors[].extensions.code. Separately - and this is the more useful half -
  the schema models expected business failures as TYPED result members inside
  unions, so a client discriminates on __typename rather than parsing a string.
