product_rename:
  note: HxDR and Reality Cloud Studio were renamed to Hexagon GeoCloud during 2026. The release-note
    series changes name mid-year - entries through April 13 2026 are titled "Reality Cloud Studio" and
    entries from April 20 2026 onward are titled "Hexagon GeoCloud". hxdr.com now 301s to geocloud.hexagon.com,
    while the API host, the app host and the status page all still carry the hxdr name. The former documentation
    host docs.hxdr.app 302s to /login and its published /featuredoc tree now 404s; documentation moved
    to rcdocs.leica-geosystems.com.
