tools_note: >-
  The live tool list could not be read. Both endpoints answered the anonymous
  tools/list call with HTTP 401, so the tool names and their inputSchemas require
  an authenticated MCP introspection. Nothing is listed here rather than guessed.
  No published tool list exists in any llms.txt or documentation page found in
  this pass.
scope_note: >-
  This server is served from the Hexagon GeoCloud WordPress site
  (geocloud.hexagon.com, WP Engine + Cloudflare) and its route namespace
  (/wp-json/mcp/...) and companion /wp-json/wp-abilities/v1 namespace identify it
  as the WordPress MCP Adapter. It is a real remote MCP endpoint on a host
  Hexagon AB controls, and it is discoverable exactly the way the MCP
  authorization spec intends - but the surface behind it is the GeoCloud web
  property, not the GeoCloud product API. The product API is the GraphQL
  endpoint recorded separately at https://hxdr.app/graphql, which has no MCP
  projection.
