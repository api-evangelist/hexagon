detail: >-
  No first-party Hexagon client library was found in any public package registry.
  Hexagon publishes no SDK for the GeoCloud GraphQL API - a consumer writes its own
  GraphQL client against graphql/hexagon-ab-hxdr.graphql. The desktop-side
  integrations Hexagon does ship (CloudWorx plugins, Cyclone 3DR, the GeoCloud
  desktop app, LGS Converter) are licensed installers distributed from Hexagon's own
  download pages, not registry packages, and LuciadRIA - the JavaScript mapping SDK
  that shows up throughout the processing-pipeline enum values - is a commercial
  Hexagon product delivered under licence rather than from npm.
