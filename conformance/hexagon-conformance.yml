    name: RFC 6750 / RFC 9728 WWW-Authenticate challenge on the protected resource
    conforms: false
    evidence: >-
      The MCP endpoint answers an anonymous POST with HTTP 401 and a JSON body but
      no WWW-Authenticate header pointing at the resource metadata, so a client
      must already know the /.well-known/oauth-protected-resource location.
