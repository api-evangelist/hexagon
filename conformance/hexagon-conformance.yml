    name: GraphQL introspection (June 2018 specification)
    conforms: true
    evidence: >-
      POST https://hxdr.app/graphql with the full IntrospectionQuery returns HTTP
      200 and a complete __schema document - 1,125 types. Saved to
      graphql/hexagon-ab-hxdr-introspection.json.
  - id: apollo-federation
    name: GraphQL federation / schema stitching
    conforms: true
    evidence: >-
      The SDL declares the federation-family directives @key(selectionSet:),
      @merge, @computed and @canonical and exposes an _entities root field, so the
      published schema is a stitched gateway over multiple subgraphs. The error
      envelope carries extensions.gateway (observed value 1.36.0).
  - id: rfc9457
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      Errors are GraphQL errors[] with extensions.code (UNAUTHENTICATED,
      GRAPHQL_VALIDATION_FAILED) over HTTP 200, not application/problem+json. The
      MCP endpoint returns a WordPress REST error envelope
      {code,message,data.status}, also not problem+json.
    note: Recorded as an honest negative, not a penalty - GraphQL has its own error contract.
