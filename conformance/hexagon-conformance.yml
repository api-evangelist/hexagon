ogc_probe:
  attempted: true
  result: none
  note: >-
    NO OGC contract is saved or derived for this provider. The WMS/WMTS/WFS and
    3D Tiles endpoints this API produces are per-account streaming subscriptions
    minted at runtime under an authenticated session - the schema's own
    AddressInterface.endpoint description says the value is "the path of the
    object, needs to be appended to the domain of the backend". There is no
    anonymous landing page, no /conformance document and no
    ?service=WMS&request=GetCapabilities endpoint reachable without credentials,
    so no GetCapabilities or conformance artifact exists to save. Recording the
    declaration without the document is the honest result.
