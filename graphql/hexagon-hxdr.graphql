"""
The data needed to construct a limiting box in 3D, around a given origin.

Steps to construct a limiting box:
1. Get the origin of the box from the item it belongs to.
For non-georeferenced assets, this is the anchor point of the asset.
For georeferenced assets, this is the `originGeolocation` of the `ReferencedBoundsOutput` of the asset.
2. Create an axis-aligned box using the origin and min & max values of the limiting box object.
3. Rotate that box using the rotation of the limiting box object.
4. Translate that box along its rotated axes by the offset of the limiting box object.
"""
type LimitingBoxAnnotationDataOutput {
  """The limiting box's offset in meters. The offset is applied after the rotation."""
  offset: AnnotationPointOutput!
  """
  The limiting box's rotation around its origin, in degrees. The rotation is applied before the offset.
  Currently, only the z-axis rotation is defined, as clockwise.
  """
  rotation: AnnotationRotationOutput!
  """The camera point of view to look at this limiting box."""
  lookAt: AnnotationOrientationOutput!
  """
  The limiting box's minimum X coordinate, in meters.
  In the georeferenced case, X is east.
  """
  minX: Float!
  """
  The limiting box's maximum X coordinate, in meters.
  In the georeferenced case, X is east.
  """
  maxX: Float!
  """
  The limiting box's minimum Y coordinate, in meters.
  In the georeferenced case, Y is north.
  """
  minY: Float!
  """
  The limiting box's maximum Y coordinate, in meters.
  In the georeferenced case, Y is north.
  """
  maxY: Float!
  """
  The limiting box's minimum Z coordinate, in meters.
  In the georeferenced case, Z is up.
  """
  minZ: Float!
  """
  The limiting box's maximum Z coordinate, in meters.
  In the georeferenced case, Z is up.
  """
  maxZ: Float!
}

