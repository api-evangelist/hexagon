"""
Measurement system used when presenting distance and length values to the user.
Extends UserSettingsMeasurementEnum with a finer-grained set of imperial units,
distinguishing between international feet (exact SI definition) and US survey feet
(used in cadastral / land surveying in the US), each with an optional inch subdivision.
"""
enum UserSettingsMeasurementEnumV2 {
  """SI metric units (meters, centimeters, etc.)."""
  METRIC
  """
  International feet (1 ft = 0.3048 m exactly, per NIST). Decimal subdivision.
  Use for general engineering and construction workflows outside the US.
  """
  IMPERIAL_INTERNATIONAL_FEET
  """
  International feet with feet-and-inches subdivision.
  Use when displaying measurements to end users accustomed to the feet-inch notation.
  """
  IMPERIAL_INTERNATIONAL_FEET_INCH
  """
  US Survey feet (1 ft = 1200/3937 m, ~2 ppm larger than international feet).
  Use for cadastral surveying and GIS workflows in the United States.
  """
  IMPERIAL_SURVEY_FEET
  """
  US Survey feet with feet-and-inches subdivision.
  Use when displaying US cadastral measurements to end users accustomed to the feet-inch notation.
  """
  IMPERIAL_SURVEY_FEET_INCH
}

