  """
  Different priorities were found for the same Categories/Category
  values. The ones found from the last modified were used.
  """
  CATEGORY_SAME_PRIORITY_CONFLICT
  """
  Same orders were found for different Categories/Category
  values. The ones found from the last modified were used.
  """
  CATEGORY_DIFFERENT_PRIORITY_CONFLICT
  """
  Same names were found for different Categories/Category values.
  The imported ones were modified to avoid duplications.
  """
  CATEGORY_SAME_NAME_CONFLICT @deprecated(reason: "No longer supported, termination planned for 2028-03-31.")
  """
  A category and a free text category have the same name. The free
  text category name was changed to avoid duplication.
  """
  CATEGORY_SAME_NAME_AS_FIELD_CONFLICT @deprecated(reason: "No longer supported, termination planned for 2028-03-31.")
  """
  The geotag import could not be completed due to an internal error.
  This issue occurs when there is a problem on our side during processing.
