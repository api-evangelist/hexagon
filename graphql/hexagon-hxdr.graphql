"""Used in Scene Lock definitions, controlling what operations the lock blocks for any user other than the lock owner."""
enum SceneLockOperationScopeEnum {
  """
  Block any update (not block creation) with a UpdateScene[Group|Leaf]NodeInput where the transformation parameter
  is not null. Other updates (changing parent, visibility, etc), deleting, creating new children, and creating new
  versions are allowed.
  """
  TRANSFORMATION
  """
  Block any update, delete, creation of new children or versions. In addition, the lock should be enforced for the
  node’s attached external entities: annotations, custom-documents.
  """
  ALL
}

"""Used in Scene Lock definitions, controlling the extent the lock restrictions are applicable to the lock owner."""
enum SceneLockOwnerRestrictionEnum {
  """
  The owner is not restricted by the lock: they are allowed to alter any node held by their lock, only other users
  are restricted.
  """
  NONE
  """
  The same restrictions apply to the owner as any other user when changing default versions of nodes held by their
  lock. The owner is allowed to freely change any non default versions of the nodes held by their lock.
  """
  DEFAULT_VERSIONS
  """
  The owner itself is subject to the same restrictions as any other user until the lock is released. This can be used
  to prevent the owner itself from accidentally making certain changes.
  """
  FULL
}

