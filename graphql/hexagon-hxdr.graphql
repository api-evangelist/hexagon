"""Point Cloud Classification models"""
enum PointCloudClassificationModelEnum {
  """
  Point cloud classification model for indoor scenes.
  The model works best on data from terrestrial and kinematic laser scanners.
  """
  PCC_IND_GEN
  """
  Point cloud classification model for indoor construction scenes.
  The model works best on data from terrestrial and kinematic laser scanners.
  """
  PCC_INDCS_GEN
  """
  Point cloud classification model for outdoor scenes.
  The model works best on data from terrestrial laser scanners.
  """
  PCC_OUTD_TLS
  """
  Point cloud classification model for heavy construction sites in outdoor scenarios.
