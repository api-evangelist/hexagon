schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}


directive @canonical on OBJECT | INTERFACE | INPUT_OBJECT | UNION | ENUM | SCALAR | FIELD_DEFINITION | INPUT_FIELD_DEFINITION


directive @computed(selectionSet: String!) on FIELD_DEFINITION

"""Marks an element of a GraphQL schema as no longer supported."""
directive @deprecated(reason: String = "No longer supported") on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE

"""Marks an element of a GraphQL schema as experimental."""
directive @experimental on FIELD_DEFINITION | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE | ENUM | INTERFACE | OBJECT | SCALAR | UNION | QUERY | MUTATION | SUBSCRIPTION | FIELD | INPUT_OBJECT

"""Directs the executor to include this field or fragment only when the `if` argument is true."""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT


directive @key(selectionSet: String!) on OBJECT

"""Instruction for establishing a live connection that is updated once the underlying data changes."""
directive @live(if: Boolean = true, throttle: Int) on QUERY


directive @merge(argsExpr: String, keyArg: String, keyField: String, key: [String!], additionalArgs: String) on FIELD_DEFINITION

"""Indicates exactly one field must be supplied and this field must not be `null`."""
directive @oneOf on INPUT_OBJECT

"""Directs the executor to skip this field or fragment when the `if` argument is true."""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(url: String!) on SCALAR

